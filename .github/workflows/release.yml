# This configuration is used for the deployment and publish to docker
name: release

on:
  push:
    branches:
      # Runs only on push to the master branch
      - ITADMIN-3539

jobs:
  release:
    timeout-minutes: 30
      
    runs-on: ubuntu-latest

    steps:
      # Checkout the git repository
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Get the current project version from version.txt
      - name: get-project-version
        id: get_project_version
        uses: avides/actions-project-version-check@71f4eaf8ae9ef4e2dd7f3d42402b252172943565 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file-to-check: version.txt
          only-return-version: true

      # Determine docker platforms
      - name: determine-docker-platforms
        id: determine_docker_platforms
        run: |
          # .github/docker.platforms is a deliberate opt-in - without it the image is built for linux/amd64 only.
          # One platform per line or a comma separated list, e.g. "linux/amd64,linux/arm64".
          if [ -f ".github/docker.platforms" ]; then
            # Commas and any whitespace (including the CR of CRLF line endings) separate platforms, so squeeze them
            # into single commas and strip a leading or trailing one.
            DOCKER_PLATFORMS=$(tr -s ',[:space:]' ',' < .github/docker.platforms | sed 's/^,//; s/,$//')
          fi

          if [ -z "$DOCKER_PLATFORMS" ]; then
            DOCKER_PLATFORMS="linux/amd64"
          fi
          echo "detected_docker_platforms=$DOCKER_PLATFORMS" >> $GITHUB_OUTPUT

      # Setup QEMU to be able to build for platforms other than the one of the runner
      - name: setup-qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      # Setup docker buildx to build for the detected platforms
      - name: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build and publish docker image
      - name: push-image
        env:
          PROJECT_VERSION: ${{ steps.get_project_version.outputs.version }}
          DOCKER_PLATFORMS: ${{ steps.determine_docker_platforms.outputs.detected_docker_platforms }}
          DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
        run: |
          echo "${DOCKER_REGISTRY_TOKEN}" | docker login "${DOCKER_REGISTRY}" -u "${DOCKER_REGISTRY_USER}" --password-stdin
          TAGS="-t ${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}:${PROJECT_VERSION}"
          if [[ "${PROJECT_VERSION}" != *"SNAPSHOT"* && "${PROJECT_VERSION}" != *"RC"* ]]; then
            TAGS="${TAGS} -t ${DOCKER_REGISTRY}/${GITHUB_REPOSITORY}:latest"
          fi
          # --provenance=false keeps a single-platform image a plain image manifest instead of an index with attestations
          docker buildx build --platform ${DOCKER_PLATFORMS} --provenance=false ${TAGS} --push .

      # Setup the sonar analyse scanner
      - name: setup-sonar
        uses: warchant/setup-sonar-scanner@911ef81b14b267a261d70ac94e43d3c822a709d5 # v10

      # Execute sonar analysis and publish results to the sonarcloud server
      - name: sonar
        env:
          PROJECT_VERSION: ${{ steps.get_project_version.outputs.version }}
          OS_SONAR_HOST_URL: ${{ secrets.OS_SONAR_HOST_URL }}
          OS_SONAR_TOKEN: ${{ secrets.OS_SONAR_TOKEN }}
        run: |
          export SONAR_ORGANIZATION=$(echo ${GITHUB_REPOSITORY} | cut -d / -f 1)
          sonar-scanner \
            -Dsonar.host.url=${OS_SONAR_HOST_URL} \
            -Dsonar.token=${OS_SONAR_TOKEN} \
            -Dsonar.organization=${SONAR_ORGANIZATION} \
            -Dsonar.projectKey=${GITHUB_REPOSITORY//\//_} \
            -Dsonar.projectVersion=${PROJECT_VERSION} \
            -Dsonar.branch.name=${GITHUB_REF_NAME}

      # Get last commit message for GitHub Release tag
      - name: setup-github-release
        id: setup_github_release
        env:
          PROJECT_VERSION: ${{ steps.get_project_version.outputs.version }}
        run: |
          echo "gitcommitmessage=$(git log --no-merges -1 --oneline)" >> $GITHUB_OUTPUT
          if [[ "$PROJECT_VERSION" == *"SNAPSHOT"* || "$PROJECT_VERSION" == *"RC"* ]]; then
            echo "isprerelease=true" >> $GITHUB_OUTPUT
          else
            echo "isprerelease=false" >> $GITHUB_OUTPUT
          fi

      # Create and publish GitHub Release tag
      - name: github-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GPR_TOKEN }}
          tag_name: ${{ steps.get_project_version.outputs.version }}
          body: ${{ steps.setup_github_release.outputs.gitcommitmessage }}
          prerelease: ${{ steps.setup_github_release.outputs.isprerelease }}
